<body>
<div id="app">
  <header>
    <div id="topRight">
      <div class="seg" id="refreshSeg" title="Auto-reload interval (hh:mm:ss). 00:00:00 turns it off. Minimum 00:00:30.">

      </div>

    </div>
    <div>
      <div class="title"><img id="headerLogo" class="title-logo" alt="" style="display:none"><span id="boardTitle">Bot Board</span> <span class="count mono" id="count"></span></div>
      <div class="sub mono" id="sub"></div>
    </div>
    <div class="controls">
      <div class="seg" title="Theme"><span class="lbl mono">Theme</span>
        <button class="btn small" data-theme-btn="auto">Auto</button>
        <button class="btn small" data-theme-btn="light">Light</button>
        <button class="btn small" data-theme-btn="dark">Dark</button>
        <button class="btn small" data-theme-btn="custom">Custom</button>
      </div>
      <div class="seg"><span class="lbl mono">Text</span>
        <button class="pm" title="Text smaller" data-bump="font" data-d="-1">−</button>
        <button class="pm" title="Text larger" data-bump="font" data-d="1">+</button>
      </div>
      <div class="seg"><span class="lbl mono">Image</span>
        <button class="pm" title="Image smaller" data-bump="img" data-d="-8">−</button>
        <button class="pm" title="Image larger" data-bump="img" data-d="8">+</button>
      </div>
      <input id="q" class="mono" placeholder="search bot, title or text…" autocomplete="off">
      <div class="groups" id="groups"></div>
      <button class="btn" id="today" title="Due today, urgent, and reminders">Today</button>

    </div>
  </header>
  <div class="banner mono" id="banner" style="display:none">Showing snoozed and dismissed cards only. Open one to restore it. Click Hidden again to go back.</div>
  <div id="board"></div>
</div>
<div id="scrim"><div id="drawer"></div></div>
<div id="setScrim"><div id="setPanel" role="dialog" aria-label="Board settings"></div></div>

<script>
const HOUR = 3600000, DAY = 24 * HOUR;
const LS_HIDDEN = "botboard.v1.hidden", LS_PREFS = "botboard.v1.prefs", LS_THEME = "botboard.v1.theme";
const LS_UI = "botboard.v1.ui", LS_REFRESH = "botboard.v1.refreshSec";
const REFRESH_MIN = 30, REFRESH_DEFAULT = 900;

function lsGet(k, f) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : f; } catch (e) { return f; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function hexOk(v) { return /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(String(v || "")); }
function hexToRgb(h) {
  if (!hexOk(h)) return null;
  let n = h.slice(1);
  if (n.length === 3) n = n[0]+n[0]+n[1]+n[1]+n[2]+n[2];
  return { r: parseInt(n.slice(0,2),16), g: parseInt(n.slice(2,4),16), b: parseInt(n.slice(4,6),16) };
}
function hexSoft(h, a) {
  const rgb = hexToRgb(h); if (!rgb) return "rgba(242,194,48," + a + ")";
  return "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + "," + a + ")";
}
function darkenHex(h) {
  const rgb = hexToRgb(h); if (!rgb) return "#7a5800";
  const r = Math.round(rgb.r * 0.42), g = Math.round(rgb.g * 0.38), b = Math.round(rgb.b * 0.2);
  const p = n => ("0" + n.toString(16)).slice(-2);
  return "#" + p(r) + p(g) + p(b);
}
function visibleColumns() { return (COLS || []).filter(c => c && !c.hidden); }
function colInk(c) { return c.ink || "#ffffff"; }

function tzParts(t) {
  const p = new Intl.DateTimeFormat("en-US", { timeZone: TZ, year:"numeric", month:"numeric", day:"numeric", hour:"numeric", minute:"numeric", hourCycle:"h23" }).formatToParts(new Date(t));
  const g = ty => Number((p.find(x => x.type === ty) || { value: "0" }).value);
  return { y: g("year"), m: g("month"), d: g("day"), h: g("hour"), min: g("minute") };
}
function nextCtMidnight(now) {
  const p = tzParts(now);
  let t = Date.UTC(p.y, p.m - 1, p.d + 1, 12, 0, 0);
  const q = tzParts(t);
  t -= q.h * HOUR + (q.min || 0) * 60000;
  const r = tzParts(t);
  if (r.h !== 0 || r.min !== 0) t -= r.h * HOUR + (r.min || 0) * 60000;
  return t;
}
function nextMorning(now) {
  const hour = (CONFIG.snooze && CONFIG.snooze.morningHour) || 9;
  const mid = nextCtMidnight(now);
  return mid + hour * HOUR;
}
function tzAbbr(v) {
  const p = new Intl.DateTimeFormat("en-US", { timeZone: TZ, timeZoneName: "short" }).formatToParts(new Date(v));
  return (p.find(x => x.type === "timeZoneName") || { value: "" }).value;
}
function fmtCT(v) {
  const d = new Date(v);
  const abbr = tzAbbr(d);
  return new Intl.DateTimeFormat("en-US", { timeZone: TZ, weekday:"short", month:"short", day:"numeric" }).format(d) + ", " +
    new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour:"numeric", minute:"2-digit" }).format(d) + (abbr ? " " + abbr : "");
}
function ctKey(t) { return new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date(t)); }
function startOfDay(dateStr) {
  const parts = String(dateStr).split("-").map(Number);
  const y = parts[0], m = parts[1], d = parts[2];
  let t = Date.UTC(y, m - 1, d, 12, 0, 0);
  const q = tzParts(t);
  t -= q.h * HOUR + (q.min || 0) * 60000;
  return t;
}
function waitMs(c, now) {
  if (c.since) return now - new Date(c.since).getTime();
  if (c.sinceBefore) return now - startOfDay(c.sinceBefore);
  return null;
}
function ageText(c, now) {
  const ms = waitMs(c, now); if (ms === null) return null;
  const plus = c.sinceBefore ? "+" : "";
  if (ms < HOUR) return "<1h";
  if (ms < DAY) return Math.floor(ms / HOUR) + "h" + plus;
  return Math.floor(ms / DAY) + "d" + plus;
}
function urgencyOn() { return !CONFIG.urgency || CONFIG.urgency.enabled !== false; }
function dueHours() { return (CONFIG.urgency && CONFIG.urgency.dueWithinHours != null) ? Number(CONFIG.urgency.dueWithinHours) : 48; }
function waitDays() { return (CONFIG.urgency && CONFIG.urgency.waitingMoreThanDays != null) ? Number(CONFIG.urgency.waitingMoreThanDays) : 3; }
function dueSoon(c, now) {
  if (!urgencyOn() || !c.due || c.col === "done") return false;
  return new Date(c.due).getTime() - now <= dueHours() * HOUR;
}
function isUrgent(c, now) {
  if (!urgencyOn()) return false;
  if (c.col === "done" || c.col === "reminders") return false;
  if (dueSoon(c, now)) return true;
  const ms = waitMs(c, now);
  return c.col === "waiting" && ms !== null && ms > waitDays() * DAY;
}
function isToday(c, now) {
  if (c.col === "done") return false;
  if (c.col === "reminders" || isUrgent(c, now)) return true;
  return !!c.due && ctKey(new Date(c.due).getTime()) <= ctKey(now);
}
function hiddenState(id, now) {
  const h = S.hidden[id]; if (!h) return null;
  if (h.type === "snooze" && (h.until || 0) <= now) return null;
  return h;
}
function chatLink(id) { return "grokbot://app/v1/agent?id=" + id; }
function initials(n) {
  const w = n.replace(/[^A-Za-z' ]/g, " ").split(" ").filter(s => s.length);
  return ((w[0] || "?").charAt(0) + (w[1] ? w[1].charAt(0) : "")).toUpperCase();
}
function thumb(c) {
  const g = c.group && GROUPS[c.group];
  if (g && g.logo && CONFIG.logo) return '<div class="thumb" style="background:#fff"><img src="' + CONFIG.logo + '" alt=""></div>';
  const color = g ? g.color : REM_COLOR;
  return '<div class="thumb" style="background:' + color + '">' + (c.col === "reminders" ? "⏰" : esc(initials(c.bot))) + '</div>';
}
function cardText(c) {
  return [c.bot, c.title, c.summary, c.next, c.schedule || "", (c.context || []).join(" "), (c.badges || []).join(" ")].join(" ").toLowerCase();
}
function customBadgeTags(c) {
  const list = (CONFIG.badges && CONFIG.badges.custom) || [];
  const text = cardText(c);
  const has = (c.badges || []).map(String);
  return list.filter(b => {
    if (!b || !b.label) return false;
    if (b.key && has.indexOf(String(b.key)) >= 0) return true;
    const kw = String(b.keyword || b.key || "").toLowerCase();
    return kw && text.indexOf(kw) >= 0;
  });
}
function snoozeKind() { return (UI.snoozeDefault || (CONFIG.snooze && CONFIG.snooze.default) || "midnight"); }
function snoozeUntil(kind, now) {
  const k = kind || snoozeKind();
  if (k === "1h") return now + HOUR;
  if (k === "4h") return now + 4 * HOUR;
  if (k === "morning") return nextMorning(now);
  if (k === "custom") {
    const hrs = Number((CONFIG.snooze && CONFIG.snooze.customHours) || 2);
    return now + (hrs > 0 ? hrs : 2) * HOUR;
  }
  return nextCtMidnight(now);
}
function snoozeLabel(kind) {
  const k = kind || snoozeKind();
  if (k === "1h") return "Snooze 1 hour";
  if (k === "4h") return "Snooze 4 hours";
  if (k === "morning") return "Snooze until tomorrow morning";
  if (k === "custom") return "Snooze " + ((CONFIG.snooze && CONFIG.snooze.customHours) || 2) + " hours";
  return "Snooze until tomorrow";
}

/* ---------- prefs / UI ---------- */
function persistOn() { return CONFIG.persistPrefs !== false; }
function uiDefaults() {
  const fields = Object.assign({ age: true, deadline: true, group: true, sources: true }, CONFIG.fields || {});
  return {
    theme: (CONFIG.theme && CONFIG.theme.preset) || "auto",
    accent: null,
    card: null,
    bg: null,
    font: null,
    density: CONFIG.density || "comfortable",
    fields: fields,
    moneyBadge: !CONFIG.badges || CONFIG.badges.money !== false,
    swimlanes: !!CONFIG.swimlanes,
    defaultFilter: CONFIG.defaultFilter || "all",
    headerLogo: !!CONFIG.showHeaderLogo,
    title: CONFIG.title || "Bot Board",
    snoozeDefault: (CONFIG.snooze && CONFIG.snooze.default) || "midnight"
  };
}
function loadUI() {
  const d = uiDefaults();
  if (!persistOn()) return d;
  const saved = lsGet(LS_UI, null);
  if (!saved || typeof saved !== "object") return d;
  const out = Object.assign({}, d, saved);
  out.fields = Object.assign({}, d.fields, saved.fields || {});
  return out;
}
function saveUI() {
  if (!persistOn()) return;
  lsSet(LS_UI, {
    theme: UI.theme, accent: UI.accent, card: UI.card, bg: UI.bg, font: UI.font,
    density: UI.density, fields: UI.fields, moneyBadge: UI.moneyBadge,
    swimlanes: UI.swimlanes, defaultFilter: UI.defaultFilter,
    headerLogo: UI.headerLogo, title: UI.title, snoozeDefault: UI.snoozeDefault
  });
  lsSet(LS_THEME, UI.theme);
}

const S = {
  q: "", group: "all", todayOnly: false, showHidden: false, selected: null, snoozeOpen: false,
  hidden: lsGet(LS_HIDDEN, {}),
  prefs: persistOn() ? lsGet(LS_PREFS, { font: 13, img: 40 }) : { font: 13, img: 40 }
};
if (!S.prefs || typeof S.prefs.font !== "number") S.prefs = { font: 13, img: 40 };
const UI = loadUI();
if (persistOn()) {
  const t = lsGet(LS_THEME, null);
  if (t && ["auto","light","dark","custom"].indexOf(t) >= 0) UI.theme = t;
}
(function applyDefaultFilter() {
  const f = UI.defaultFilter || "all";
  if (f === "today") { S.todayOnly = true; S.group = "all"; }
  else if (f && f !== "all") { S.group = f; S.todayOnly = false; }
})();

const mq = window.matchMedia("(prefers-color-scheme: dark)");
function clearVars() {
  const root = document.documentElement;
  ["--bg","--panel","--panel2","--edge","--cardEdge","--gold","--goldSoft","--goldInk"].forEach(v => root.style.removeProperty(v));
  document.body.style.fontFamily = "";
}
function themeIsDark() {
  if (UI.theme === "dark") return true;
  if (UI.theme === "light") return false;
  if (UI.theme === "custom") return !!(mq.matches);
  return mq.matches;
}
function applyTheme() {
  clearVars();
  const dark = themeIsDark();
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  document.querySelectorAll("[data-theme-btn]").forEach(b => b.classList.toggle("active", b.dataset.themeBtn === UI.theme));
  const nb = document.getElementById("nightBtn");
  nb.innerHTML = (dark ? "☀" : "☾") + (UI.theme === "auto" ? '<span class="auto mono">AUTO</span>' : "");
  nb.title = (dark ? "Night on · tap for Day" : "Day on · tap for Night") + (UI.theme === "auto" ? " (following your computer)" : "") + " · long-press: Auto";
  const root = document.documentElement;
  const cfgAccent = CONFIG.theme && CONFIG.theme.accent;
  const accent = UI.accent || cfgAccent || null;
  const useAccent = accent && hexOk(accent) && (UI.accent || UI.theme === "custom" || (cfgAccent && String(cfgAccent).toLowerCase() !== "#f2c230"));
  if (useAccent) {
    root.style.setProperty("--gold", accent);
    root.style.setProperty("--goldSoft", hexSoft(accent, dark ? 0.15 : 0.22));
    root.style.setProperty("--goldInk", dark ? accent : darkenHex(accent));
  }
  const card = UI.card, bg = UI.bg;
  if (card && hexOk(card)) root.style.setProperty("--panel2", card);
  if (bg && hexOk(bg)) root.style.setProperty("--bg", bg);
  const fontKey = UI.font;
  if (fontKey && FONTS[fontKey] && fontKey !== "system") document.body.style.fontFamily = FONTS[fontKey];
  else if (fontKey && fontKey !== "system" && String(fontKey).length < 120) document.body.style.fontFamily = String(fontKey);
  document.body.classList.toggle("compact", UI.density === "compact");
  const title = UI.title || CONFIG.title || "Bot Board";
  document.getElementById("boardTitle").textContent = title;
  document.title = title;
  const logo = document.getElementById("headerLogo");
  if (UI.headerLogo && CONFIG.logo) { logo.src = CONFIG.logo; logo.style.display = ""; }
  else { logo.removeAttribute("src"); logo.style.display = "none"; }
}
function setTheme(t) { UI.theme = t; saveUI(); applyTheme(); }
mq.addEventListener ? mq.addEventListener("change", applyTheme) : mq.addListener(applyTheme);
function applyPrefs() {
  document.body.style.setProperty("--font", S.prefs.font + "px");
  document.body.style.setProperty("--img", S.prefs.img + "px");
  document.body.classList.toggle("noimg", S.prefs.img <= 0);
}

/* ---------- render ---------- */
function render() {
  const now = Date.now();
  const all = BOARD.cards;
  const hiddenCount = all.filter(c => hiddenState(c.id, now)).length;
  const waiting = all.filter(c => !hiddenState(c.id, now) && c.col === "waiting");
  const urgent = waiting.filter(c => isUrgent(c, now)).length;
  document.getElementById("count").textContent = waiting.length + " need you · " + urgent + " urgent";
  document.getElementById("sub").textContent = "click a card for details · updated " + fmtCT(BOARD.updated) + " · pushes " + (CONFIG.pushTimes || "");
  document.getElementById("hiddenBtn").textContent = "Hidden (" + hiddenCount + ")";
  document.getElementById("hiddenBtn").classList.toggle("active", S.showHidden);
  document.getElementById("today").classList.toggle("active", S.todayOnly);
  document.getElementById("banner").style.display = S.showHidden ? "" : "none";
  document.querySelectorAll("[data-group]").forEach(b => b.classList.toggle("active", b.dataset.group === S.group));

  const needle = S.q.trim().toLowerCase();
  const show = UI.fields || {};
  const visible = all.filter(c => {
    const h = hiddenState(c.id, now);
    if (S.showHidden ? !h : h) return false;
    if (S.group !== "all" && c.group !== undefined && c.group !== S.group) return false;
    if (S.todayOnly && !isToday(c, now)) return false;
    if (!needle) return true;
    return cardText(c).indexOf(needle) >= 0;
  });

  const cols = visibleColumns();
  const boardEl = document.getElementById("board");
  boardEl.style.gridTemplateColumns = "repeat(" + Math.max(1, cols.length) + ", minmax(220px, 1fr))";

  const html = cols.map(col => {
    const list = visible.filter(c => c.col === col.key).sort((a, b) => {
      const u = Number(isUrgent(b, now)) - Number(isUrgent(a, now)); if (u) return u;
      return (a.group ? GROUP_ORDER.indexOf(a.group) : -1) - (b.group ? GROUP_ORDER.indexOf(b.group) : -1);
    });
    function cardHtml(c, i, total) {
      const urg = isUrgent(c, now), age = show.age !== false ? ageText(c, now) : null, h = hiddenState(c.id, now);
      const meta = [];
      if (c.col === "reminders") meta.push((c.schedule || "") + " · recurring");
      else {
        if (show.group !== false) meta.push(c.group && GROUPS[c.group] ? GROUPS[c.group].label : CONFIG.boardBotName);
        if (age && c.col !== "done") meta.push((c.col === "waiting" ? "waiting " : "open ") + age);
      }
      let tags = (urg ? '<span class="tag urgent mono">URGENT</span>' : "") + (UI.moneyBadge !== false && c.money ? '<span class="tag money mono">$</span>' : "");
      customBadgeTags(c).forEach(b => {
        const colr = hexOk(b.color) ? b.color : "var(--gold)";
        tags += '<span class="tag mono" style="color:' + colr + ";border-color:" + colr + '">' + esc(b.label) + "</span>";
      });
      if (h) tags += '<span class="tag hid mono">' + (h.type === "dismiss" ? "DISMISSED" : "SNOOZED → " + esc(fmtCT(h.until || 0))) + "</span>";
      return '<div class="card' + (c.col === "done" || h ? " faded" : "") + '" tabindex="0" role="button" data-id="' + c.id + '" style="border-left-color:' + (c.group && GROUPS[c.group] ? GROUPS[c.group].color : REM_COLOR) + '">' +
        '<div class="idx mono">' + (i + 1) + "/" + total + "</div>" +
        '<div class="top">' + thumb(c) + '<div class="who"><div class="bot">' + esc(c.bot) + '</div>' +
        (meta.length ? '<div class="meta">' + esc(meta.join(" · ")) + "</div>" : "") +
        (tags ? '<div class="tags">' + tags + "</div>" : "") + "</div></div>" +
        '<div class="body"><div class="ttl">' + esc(c.title) + '</div><div class="sum">' + esc(c.summary) + "</div>" +
        (show.deadline !== false && c.due ? '<div class="due mono' + (dueSoon(c, now) ? " soon" : "") + '">' + esc((c.dueNote || "due") + " " + fmtCT(c.due)) + "</div>" : "") +
        "</div></div>";
    }
    let body = "";
    if (!list.length) {
      body = '<div class="empty mono">' + (S.q || S.todayOnly || S.group !== "all" ? "No matches" : S.showHidden ? "Nothing hidden here" : "All clear") + "</div>";
    } else if (UI.swimlanes) {
      const lanes = [];
      GROUP_ORDER.forEach(k => lanes.push(k));
      lanes.push("");
      const used = {};
      lanes.forEach(k => {
        const items = list.filter(c => (c.group || "") === k);
        if (!items.length) return;
        used[k] = true;
        const label = k && GROUPS[k] ? GROUPS[k].label : (CONFIG.boardBotName || "General");
        body += '<div class="lane"><div class="lane-label mono">' + esc(label) + "</div>" +
          items.map(c => cardHtml(c, list.indexOf(c), list.length)).join("") + "</div>";
      });
      list.forEach((c, i) => {
        if (used[c.group || ""]) return;
        used[c.group || ""] = true;
        const items = list.filter(x => (x.group || "") === (c.group || ""));
        const label = c.group && GROUPS[c.group] ? GROUPS[c.group].label : (CONFIG.boardBotName || "General");
        body += '<div class="lane"><div class="lane-label mono">' + esc(label) + "</div>" +
          items.map(x => cardHtml(x, list.indexOf(x), list.length)).join("") + "</div>";
      });
    } else {
      body = list.map((c, i) => cardHtml(c, i, list.length)).join("");
    }
    return '<section class="col"><div class="colhead" style="background:' + col.color + ";color:" + colInk(col) + '"><div class="n">' + esc(col.label) + '</div><div class="c mono">' + list.length + "</div></div>" +
      '<div class="colbody">' + body + "</div></section>";
  }).join("");
  const scrolls = Array.from(boardEl.querySelectorAll(".colbody")).map(e => e.scrollTop);
  boardEl.innerHTML = html;
  boardEl.querySelectorAll(".colbody").forEach((e, i) => { e.scrollTop = scrolls[i] || 0; });
  renderDrawer();
}

function renderDrawer() {
  const scrim = document.getElementById("scrim");
  const c = BOARD.cards.find(x => x.id === S.selected);
  if (!c) { scrim.classList.remove("open"); return; }
  const now = Date.now();
  const h = hiddenState(c.id, now);
  const col = COLS.find(x => x.key === c.col);
  const colLabel = col ? col.label : c.col;
  const age = ageText(c, now);
  const show = UI.fields || {};
  const facts = [];
  if (c.schedule) facts.push("<span>" + esc(c.schedule) + " · recurring until you remove it</span>");
  if (show.age !== false && age && c.col !== "done" && c.col !== "reminders") facts.push("<span>" + (c.col === "waiting" ? "waiting " : "open ") + age + (c.since ? " (since " + esc(fmtCT(c.since)) + ")" : " (since before " + esc(c.sinceBefore) + ")") + "</span>");
  if (show.deadline !== false && c.due) facts.push('<span style="color:' + (dueSoon(c, now) ? "var(--dangerInk)" : "var(--dim)") + '">' + esc((c.dueNote || "deadline") + " " + fmtCT(c.due)) + "</span>");
  if (UI.moneyBadge !== false && c.money) facts.push('<span style="color:var(--goldInk)">$ financial</span>');
  if (isUrgent(c, now)) facts.push('<span style="color:var(--dangerInk)">URGENT</span>');
  const until = snoozeUntil(snoozeKind(), now);
  const menu = [
    ["midnight", "Until midnight"],
    ["1h", "1 hour"],
    ["4h", "4 hours"],
    ["morning", "Tomorrow morning"]
  ].map(pair => '<button type="button" data-act="snooze-for" data-kind="' + pair[0] + '">' + pair[1] + "</button>").join("") +
    '<div class="snooze-custom"><input id="snoozeHrs" type="number" min="1" max="72" value="' + esc((CONFIG.snooze && CONFIG.snooze.customHours) || 2) + '" aria-label="Custom hours"><button type="button" data-act="snooze-custom">Custom hours</button></div>';
  const srcs = (show.sources !== false && c.links && c.links.length)
    ? '<div class="srcs"><div class="k mono">SOURCES</div>' + c.links.map(l => '<a class="lnk" href="' + esc(l.href) + '" target="_blank" rel="noopener noreferrer">' + esc(l.title) + ' <span class="site mono">· ' + esc(l.site) + "</span></a>").join("") + "</div>"
    : "";
  document.getElementById("drawer").innerHTML =
    '<div class="dhead"><div class="l">' + thumb(c) + '<div style="min-width:0"><div class="crumb mono">' + esc(c.bot) + " · " + esc(colLabel) + (show.group !== false && c.group && GROUPS[c.group] ? " · " + esc(GROUPS[c.group].label) : "") + '</div><div class="dt">' + esc(c.title) + "</div></div></div>" +
    '<button class="btn small" data-act="close" title="Close">✕</button></div>' +
    (h
      ? '<div class="row"><button class="btn primary" data-act="restore">Restore card</button><span class="note mono">' + (h.type === "dismiss" ? "Dismissed " + esc(fmtCT(h.at)) : "Snoozed until " + esc(fmtCT(h.until || 0))) + "</span></div>"
      : '<div class="row"><button class="btn primary" data-act="snooze">' + esc(snoozeLabel()) + '</button><div class="snooze-wrap"><button class="btn small" data-act="snooze-menu" title="More snooze options">▾</button><div class="snooze-menu' + (S.snoozeOpen ? " open" : "") + '" id="snoozeMenu">' + menu + '</div></div><span class="note mono">back ' + esc(fmtCT(until)) + '</span></div>') +
    (facts.length ? '<div class="facts mono">' + facts.join("") + "</div>" : "") +
    '<div style="color:var(--dim)">' + esc(c.summary) + "</div>" +
    (c.context && c.context.length ? '<ul class="d-ctx">' + c.context.map(t => "<li>" + esc(t) + "</li>").join("") + "</ul>" : "") +
    '<div class="next"><div class="k mono">NEXT STEP</div><div>' + esc(c.next) + "</div></div>" +
    srcs +
    '<div class="chat"><a class="lnk" href="' + chatLink(c.botId) + '">Open ' + esc(c.bot) + ' chat →</a><div class="fine mono">Nothing on this board sends anything. Emails, replies, payments and bookings go out only after you approve them in chat.</div></div>' +
    (h ? "" : '<div class="row dismiss"><button class="btn danger" data-act="dismiss">Dismiss</button><span class="fine mono">hides it for good · restore any time from Hidden</span></div>');
  scrim.classList.add("open");
}

function applySnooze(kind, hours) {
  const id = S.selected; if (!id) return;
  let until;
  if (kind === "custom") {
    const hrs = Number(hours || (document.getElementById("snoozeHrs") && document.getElementById("snoozeHrs").value) || 2);
    until = Date.now() + (hrs > 0 ? hrs : 2) * HOUR;
  } else until = snoozeUntil(kind, Date.now());
  S.hidden[id] = { type: "snooze", until: until, at: Date.now() };
  lsSet(LS_HIDDEN, S.hidden); S.selected = null; S.snoozeOpen = false; render();
}

/* ---------- settings ---------- */
function renderSettings() {
  const p = document.getElementById("setPanel");
  const f = UI.fields || {};
  const filterOpts = [["all","All"],["today","Today"]].concat(GROUP_ORDER.map(k => [k, (GROUPS[k] && (GROUPS[k].button || GROUPS[k].label)) || k]))
    .map(pair => '<option value="' + esc(pair[0]) + '"' + (UI.defaultFilter === pair[0] ? " selected" : "") + ">" + esc(pair[1]) + "</option>").join("");
  const snoozeOpts = [["midnight","Until midnight"],["1h","1 hour"],["4h","4 hours"],["morning","Tomorrow morning"],["custom","Custom hours"]]
    .map(pair => '<option value="' + pair[0] + '"' + (snoozeKind() === pair[0] ? " selected" : "") + ">" + pair[1] + "</option>").join("");
  const fontVal = UI.font && FONTS[UI.font] ? UI.font : (UI.font ? "system" : "system");
  p.innerHTML =
    '<div class="dhead"><h2>Settings</h2><button class="btn small" data-act="set-close" title="Close">✕</button></div>' +
    '<p class="hint">These options stay in this browser when preference saving is on. Columns and urgency rules are edited in CONFIG, or ask the bot.</p>' +
    '<h3>THEME</h3><div class="set-row">' +
      ["auto","light","dark","custom"].map(m => '<button class="btn small" data-theme-btn="' + m + '">' + (m[0].toUpperCase()+m.slice(1)) + "</button>").join("") +
    "</div>" +
    '<div class="set-grid">' +
      '<label>Accent</label><input type="color" id="setAccent" value="' + esc(UI.accent || (CONFIG.theme && CONFIG.theme.accent) || "#f2c230") + '"><input type="text" id="setAccentHex" value="' + esc(UI.accent || "") + '" placeholder="#f2c230">' +
      '<label>Card</label><input type="color" id="setCard" value="' + esc(UI.card || (themeIsDark() ? "#1b2544" : "#eef2f7")) + '"><input type="text" id="setCardHex" value="' + esc(UI.card || "") + '" placeholder="default">' +
      '<label>Background</label><input type="color" id="setBg" value="' + esc(UI.bg || (themeIsDark() ? "#000000" : "#d6dde8")) + '"><input type="text" id="setBgHex" value="' + esc(UI.bg || "") + '" placeholder="default">' +
      '<label>Font</label><select id="setFont"><option value="system"' + (fontVal==="system"?" selected":"") + '>System</option><option value="serif"' + (fontVal==="serif"?" selected":"") + '>Serif</option><option value="mono"' + (fontVal==="mono"?" selected":"") + '>Mono</option></select><span></span>' +
    "</div>" +
    '<h3>DENSITY</h3><div class="set-row">' +
      '<button class="btn small' + (UI.density!=="compact"?" active":"") + '" data-act="density" data-val="comfortable">Comfortable</button>' +
      '<button class="btn small' + (UI.density==="compact"?" active":"") + '" data-act="density" data-val="compact">Compact</button>' +
    "</div>" +
    '<h3>CARD FIELDS</h3><div class="set-row">' +
      fieldChk("age","Age", f.age !== false) + fieldChk("deadline","Deadline", f.deadline !== false) +
      fieldChk("group","Group", f.group !== false) + fieldChk("sources","Sources", f.sources !== false) +
    "</div>" +
    '<h3>BOARD</h3><div class="set-grid">' +
      '<label>Title</label><input type="text" id="setTitle" value="' + esc(UI.title || "Bot Board") + '" style="grid-column:span 2">' +
      '<label>Load filter</label><select id="setFilter">' + filterOpts + "</select><span></span>" +
      '<label>Snooze</label><select id="setSnooze">' + snoozeOpts + "</select><span></span>" +
    "</div>" +
    '<div class="set-row">' +
      fieldChk("moneyBadge","$ badge", UI.moneyBadge !== false) +
      fieldChk("swimlanes","Swimlanes by group", !!UI.swimlanes) +
      fieldChk("headerLogo","Show logo in header", !!UI.headerLogo) +
    "</div>" +
    '<p class="hint">Refresh on/off and the interval are in the top-right timer (00:00:00 turns it off).</p>' +
    '<div class="set-row"><button class="btn" id="resetPrefs" type="button">Reset to defaults</button></div>';
}
function fieldChk(key, label, on) {
  return '<label class="chk"><input type="checkbox" data-field="' + key + '"' + (on ? " checked" : "") + "> " + esc(label) + "</label>";
}
function openSettings() { renderSettings(); document.getElementById("setScrim").classList.add("open"); document.getElementById("gearBtn").classList.add("active"); applyTheme(); }
function closeSettings() { document.getElementById("setScrim").classList.remove("open"); document.getElementById("gearBtn").classList.remove("active"); }
function resetPrefs() {
  lsDel(LS_UI); lsDel(LS_THEME); lsDel(LS_PREFS); lsDel(LS_REFRESH);
  S.prefs = { font: 13, img: 40 };
  const d = uiDefaults();
  Object.keys(d).forEach(k => { UI[k] = d[k]; });
  applyPrefs(); applyTheme();
  if (typeof applyRefreshDefault === "function") applyRefreshDefault(true);
  S.group = "all"; S.todayOnly = false;
  const f = UI.defaultFilter || "all";
  if (f === "today") S.todayOnly = true;
  else if (f !== "all") S.group = f;
  render(); renderSettings(); applyTheme();
}
function bindColor(colorId, hexId, key) {
  const c = document.getElementById(colorId), h = document.getElementById(hexId);
  if (!c || !h) return;
  c.addEventListener("input", () => { UI[key] = c.value; h.value = c.value; if (key==="accent" && UI.theme==="auto") UI.theme = "custom"; saveUI(); applyTheme(); });
  h.addEventListener("change", () => {
    const v = h.value.trim();
    if (!v) { UI[key] = null; saveUI(); applyTheme(); return; }
    if (!hexOk(v)) return;
    UI[key] = v; c.value = v; if (key==="accent" && UI.theme==="auto") UI.theme = "custom"; saveUI(); applyTheme();
  });
}

/* ---------- events ---------- */
document.getElementById("groups").innerHTML = GROUP_BTNS.map(([v, l]) => '<button class="btn" data-group="' + v + '">' + l + "</button>").join("");
document.addEventListener("click", e => {
  const t = e.target.closest("button, .card, #scrim, #setScrim, label");
  if (!t) return;
  if (t.id === "setScrim") { if (e.target.closest("#setPanel")) return; closeSettings(); return; }
  if (t.id === "gearBtn") { document.getElementById("setScrim").classList.contains("open") ? closeSettings() : openSettings(); return; }
  if (t.dataset.themeBtn) { setTheme(t.dataset.themeBtn); if (document.getElementById("setScrim").classList.contains("open")) renderSettings(); return; }
  if (t.id === "nightBtn") {
    if (longPressed) { longPressed = false; return; }
    setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"); return;
  }
  if (t.dataset.bump) {
    const d = Number(t.dataset.d);
    if (t.dataset.bump === "font") S.prefs.font = Math.max(10, Math.min(20, S.prefs.font + d));
    else S.prefs.img = Math.max(0, Math.min(88, S.prefs.img + d));
    if (persistOn()) lsSet(LS_PREFS, S.prefs); applyPrefs(); return;
  }
  if (t.dataset.group) { S.group = t.dataset.group; render(); return; }
  if (t.id === "today") { S.todayOnly = !S.todayOnly; render(); return; }
  if (t.id === "hiddenBtn") { S.showHidden = !S.showHidden; render(); return; }
  if (t.classList.contains("card")) { S.selected = t.dataset.id; S.snoozeOpen = false; renderDrawer(); return; }
  if (t.id === "resetPrefs") { resetPrefs(); return; }
  if (t.dataset.act === "density") { UI.density = t.dataset.val; saveUI(); applyTheme(); render(); renderSettings(); return; }
  if (t.dataset.act === "set-close") { closeSettings(); return; }
  const act = t.dataset.act, id = S.selected;
  if (act === "close" || t.id === "scrim") { S.selected = null; S.snoozeOpen = false; renderDrawer(); return; }
  if (act === "snooze-menu") { e.stopPropagation(); S.snoozeOpen = !S.snoozeOpen; renderDrawer(); return; }
  if (act === "snooze") { applySnooze(snoozeKind()); return; }
  if (act === "snooze-for") { applySnooze(t.dataset.kind); return; }
  if (act === "snooze-custom") { applySnooze("custom"); return; }
  if (act === "dismiss") { S.hidden[id] = { type: "dismiss", at: Date.now() }; lsSet(LS_HIDDEN, S.hidden); S.selected = null; S.snoozeOpen = false; render(); return; }
  if (act === "restore") { delete S.hidden[id]; lsSet(LS_HIDDEN, S.hidden); S.selected = null; render(); return; }
});
document.getElementById("setPanel").addEventListener("change", e => {
  const t = e.target;
  if (t.id === "setFont") { UI.font = t.value === "system" ? null : t.value; saveUI(); applyTheme(); }
  if (t.id === "setFilter") { UI.defaultFilter = t.value; saveUI(); }
  if (t.id === "setSnooze") { UI.snoozeDefault = t.value; saveUI(); if (S.selected) renderDrawer(); }
  if (t.id === "setTitle") { UI.title = t.value.trim() || (CONFIG.title || "Bot Board"); saveUI(); applyTheme(); }
  if (t.dataset.field) {
    const k = t.dataset.field, on = t.checked;
    if (k === "moneyBadge") UI.moneyBadge = on;
    else if (k === "swimlanes") UI.swimlanes = on;
    else if (k === "headerLogo") UI.headerLogo = on;
    else { UI.fields = UI.fields || {}; UI.fields[k] = on; }
    saveUI(); applyTheme(); render();
  }
});
document.getElementById("setPanel").addEventListener("click", e => e.stopPropagation());
document.getElementById("drawer").addEventListener("click", e => { if (!e.target.closest("button")) e.stopPropagation(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (document.getElementById("setScrim").classList.contains("open")) { closeSettings(); return; }
    if (S.selected) { S.selected = null; S.snoozeOpen = false; renderDrawer(); return; }
  }
  const card = e.target.closest && e.target.closest(".card");
  if (card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); S.selected = card.dataset.id; S.snoozeOpen = false; renderDrawer(); }
});
let lpTimer = null, longPressed = false;
const nightBtn = document.getElementById("nightBtn");
nightBtn.addEventListener("pointerdown", () => { longPressed = false; clearTimeout(lpTimer); lpTimer = setTimeout(() => { longPressed = true; setTheme("auto"); }, 600); });
["pointerup", "pointerleave", "pointercancel"].forEach(ev => nightBtn.addEventListener(ev, () => clearTimeout(lpTimer)));
nightBtn.addEventListener("contextmenu", e => e.preventDefault());
document.getElementById("q").addEventListener("input", e => { S.q = e.target.value; render(); });
document.getElementById("setScrim").addEventListener("click", e => { if (e.target.id === "setScrim") closeSettings(); });

/* ---------- auto-reload ---------- */
function defaultRefreshSec() {
  const r = CONFIG.refresh || {};
  if (r.enabled === false) return 0;
  const n = Number(r.intervalSec);
  if (n === 0) return 0;
  if (n >= REFRESH_MIN) return n;
  return REFRESH_DEFAULT;
}
let refreshSec = persistOn() ? Number(lsGet(LS_REFRESH, defaultRefreshSec())) : defaultRefreshSec();
if (!(refreshSec === 0 || refreshSec >= REFRESH_MIN)) refreshSec = defaultRefreshSec();
let remaining = refreshSec;
const rIn = document.getElementById("refreshIn"), rLeft = document.getElementById("refreshLeft");
function hms(t) { const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), x = t % 60; return [h, m, x].map(n => String(n).padStart(2, "0")).join(":"); }
function parseHms(v) {
  const m = /^\s*(\d{1,2}):([0-5]\d):([0-5]\d)\s*$/.exec(v);
  return m ? Number(m[1]) * 3600 + Number(m[2]) * 60 + Number(m[3]) : null;
}
function isPaused() { return !!S.selected || document.activeElement === rIn || document.getElementById("setScrim").classList.contains("open"); }
function showLeft() {
  rLeft.classList.remove("paused");
  if (refreshSec === 0) { rLeft.textContent = "off"; return; }
  if (isPaused()) { rLeft.textContent = "paused"; rLeft.classList.add("paused"); return; }
  const t = remaining;
  rLeft.textContent = "in " + (t >= 3600 ? hms(t) : hms(t).slice(3));
}
function commitRefresh() {
  const v = parseHms(rIn.value);
  if (v === null || (v !== 0 && v < REFRESH_MIN)) {
    rIn.classList.add("bad");
    rIn.title = v === null ? "Use hh:mm:ss, e.g. 00:15:00" : "Minimum is 00:00:30 (00:00:00 turns it off)";
    return false;
  }
  rIn.classList.remove("bad"); rIn.title = "";
  refreshSec = v; remaining = v; if (persistOn()) lsSet(LS_REFRESH, v); rIn.value = hms(v); showLeft();
  return true;
}
function applyRefreshDefault(force) {
  refreshSec = defaultRefreshSec();
  remaining = refreshSec;
  rIn.value = hms(refreshSec);
  showLeft();
}
rIn.value = hms(refreshSec);
rIn.addEventListener("keydown", e => { if (e.key === "Enter") { if (commitRefresh()) rIn.blur(); } else if (e.key === "Escape") { rIn.value = hms(refreshSec); rIn.classList.remove("bad"); rIn.blur(); } });
rIn.addEventListener("input", () => rIn.classList.remove("bad"));
rIn.addEventListener("focus", showLeft);
rIn.addEventListener("blur", () => { if (!commitRefresh()) { rIn.value = hms(refreshSec); rIn.classList.remove("bad"); } showLeft(); });
document.getElementById("reloadNow").addEventListener("click", () => location.reload());
setInterval(() => {
  if (refreshSec > 0 && !isPaused()) { remaining--; if (remaining <= 0) { location.reload(); return; } }
  showLeft();
}, 1000);
showLeft();

function bindSettingsColors() {
  bindColor("setAccent","setAccentHex","accent");
  bindColor("setCard","setCardHex","card");
  bindColor("setBg","setBgHex","bg");
}
const _openSettings = openSettings;
openSettings = function () { _openSettings(); bindSettingsColors(); };

applyTheme(); applyPrefs(); render();
setInterval(render, 60000);
</script>
</body>
</html>
